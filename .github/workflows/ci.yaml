name: CI

on:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'feature/*'

jobs:
  pre-commit:
    name: "Run Pre-Commit Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
  build:
    name: "Build Artifacts"
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute version
        id: version
        run: |
          # If this run is for a tag (refs/tags/...), compute a cleaned version;
          # otherwise set a safe default version for non-tag pushes.
          if [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then
            RAW=$(git describe --tags || git describe --always || echo "0.0.0")
            echo "VERSION=${RAW#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
          fi
      - name: Build
        run: ./build.sh ${{ steps.version.outputs.VERSION }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmower-cli
          path: build/*.deb
  tagged-release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    steps:
      - name: Download artifacts from build stage
        uses: actions/download-artifact@v4
        with:
          name: openmower-cli
          path: artifacts
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: "artifacts/*.deb"
